<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>HOMESTEAD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%230f0d16'/><path d='M164 214L190 108L232 196Z M222 196L256 88L290 196Z M280 196L322 108L348 214Z' fill='%23B5E853'/><ellipse cx='256' cy='300' rx='172' ry='116' fill='%23FF6EC7'/><circle cx='222' cy='296' r='54' fill='white'/><circle cx='228' cy='298' r='25' fill='%230f0d16'/></svg>">
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945). -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- HOMESTEAD has one fixed dark look (CLAUDE.md "## Design"), so <html>
       carries the dark class permanently instead of following the viewer's
       Homeroom theme. -->
</head>
<body class="min-h-screen bg-ground text-fg antialiased">
  <!-- The header: wordmark, wallet, and the screens. On small screens
       the tabs wrap onto further rows under the wordmark. -->
  <header class="sticky top-0 z-20 border-b border-line bg-ground/95 backdrop-blur" style="padding-top: var(--un-safe-inset-top, env(safe-area-inset-top, 0px))">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-3 gap-y-2 px-4 py-3 xl:flex-nowrap">
      <a href="/" data-nav class="flex min-h-11 items-center gap-2 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus" aria-label="HOMESTEAD home">
        <svg class="h-9 w-9 shrink-0" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M30 40l8-16 6 14 6-16 6 16 6-14 8 16z" class="fill-accent"/>
          <ellipse cx="50" cy="64" rx="30" ry="24" class="fill-punk"/>
          <circle cx="50" cy="60" r="10" class="fill-fg"/>
          <circle cx="52" cy="61" r="5" class="fill-ground"/>
        </svg>
        <span class="text-heading font-black tracking-tight">HOMESTEAD</span>
      </a>
      <!-- One button: the signed-in player's name, opening their profile
           (wallet and STEAD live there), or CONNECT with no wallet. -->
      <div id="wallet" class="relative ml-auto xl:order-last"></div>
      <nav aria-label="Main" class="order-last w-full min-w-0 xl:order-none xl:w-auto xl:flex-1">
        <ul id="nav" class="flex flex-wrap gap-1"></ul>
      </nav>
    </div>
  </header>

  <main id="view" class="mx-auto max-w-6xl px-4 pb-16 pt-6" style="padding-bottom: calc(4rem + var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px)))" tabindex="-1"></main>

  <!-- Rename a Creature (creatures.js). Outside #view so a re-render never
       closes it. Only the name changes. -->
  <dialog id="rename-dialog" class="dialog" aria-labelledby="rename-title">
    <form id="rename-form" novalidate>
      <h2 id="rename-title" class="text-heading font-black">Rename Creature</h2>
      <p class="mt-4 text-small text-muted">Current name</p>
      <p id="rename-current" class="break-words text-body font-bold"></p>
      <label for="rename-input" class="mt-4 block text-small text-muted">New name</label>
      <input id="rename-input" class="field mt-1" type="text" autocomplete="off" spellcheck="false" aria-describedby="rename-hint rename-error">
      <p id="rename-hint" class="mt-2 text-small text-muted">2 to 20 letters, numbers or spaces.</p>
      <p id="rename-error" role="alert" class="mt-2 text-small text-danger" hidden></p>
      <div class="mt-5 flex justify-end gap-2">
        <button type="button" id="rename-cancel" class="btn-secondary">CANCEL</button>
        <button type="submit" id="rename-save" class="btn-primary">SAVE</button>
      </div>
    </form>
  </dialog>
